<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#140d0a" />
    <meta
      name="description"
      content="Kurio: marketplace de NFTs para descobrir, colecionar e comprar arte digital de criadores emergentes e consagrados."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Kurio · Marketplace de NFTs</title>
    <!--
      App shell: pintado antes do JavaScript (que precisa iniciar o MSW antes de
      renderizar). O React substitui este conteúdo ao montar.
    -->
    <style>
      html {
        background: #140d0a;
        color: #f5f1eb;
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: 'Roboto Mono Variable', ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 16px 0;
      }
      .shell-header {
        display: flex;
        align-items: flex-start;
        height: 45px;
        border-bottom: 1px solid rgb(210 138 76 / 0.3);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.05em;
        padding-top: 8px;
        box-sizing: border-box;
      }
      .shell-hero {
        margin-top: 24px;
        height: 190px;
        border-radius: 28px;
        background: linear-gradient(135deg, #5a3a24, #241612);
      }
      @media (min-width: 1024px) {
        .shell {
          padding: 24px 0 0;
        }
        .shell-hero {
          margin: 32px 0 0 auto;
          width: 450px;
          height: 450px;
          border-radius: 24px;
          background: #241612;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="shell">
        <div class="shell-header">KURIO</div>
        <div class="shell-hero" aria-hidden="true"></div>
        <p style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">
          Carregando a Kurio…
        </p>
      </div>
    </div>
    <noscript>
      <p style="padding: 16px">A Kurio precisa de JavaScript para funcionar.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
